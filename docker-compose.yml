services:
  jetbuddy:
    image: ghcr.io/kasperskytte/jetbuddy:latest
    # Or build it yourself from this folder:
    # build: .
    container_name: jetbuddy
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      # Optional: require a password. Leave empty for no login (fine on a
      # trusted home network).
      JETBUDDY_PASSWORD: ""
