services:
  nestegg:
    image: ghcr.io/kasperskytte/nestegg:latest
    # Or build it yourself from this folder:
    # build: .
    container_name: nestegg
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      # Optional: require a password. Leave empty for no login (fine on a
      # trusted home network).
      NESTEGG_PASSWORD: ""
