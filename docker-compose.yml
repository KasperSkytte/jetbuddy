services:
  sparegrisen:
    image: ghcr.io/kasperskytte/sparegrisen:latest
    # Or build it yourself from this folder:
    # build: .
    container_name: sparegrisen
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    # environment:
    #   # Stop new budgets being created from the login page (e.g. if the
    #   # server is reachable from the internet).
    #   SPAREGRISEN_ALLOW_NEW_BUDGETS: "false"
